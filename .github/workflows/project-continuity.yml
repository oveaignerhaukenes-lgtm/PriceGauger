name: Project continuity journal

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: project-continuity-main
  cancel-in-progress: false

jobs:
  refresh-journal:
    if: github.actor != 'github-actions[bot]' || github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 200
          persist-credentials: true
      - name: Verify journal generation
        run: python -m unittest discover -s tests -p 'test_project_changelog.py'
      - name: Refresh and push bounded journal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Re-read main each time: other merges may land while Actions is running.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            python scripts/update_project_changelog.py
            if git diff --quiet -- docs/PROJECT_CHANGELOG.md; then
              echo "Project journal already current"
              exit 0
            fi
            git add docs/PROJECT_CHANGELOG.md
            git commit -m "docs: refresh project continuity journal [skip ci]"
            if git push origin HEAD:main; then
              echo "Project journal updated"
              exit 0
            fi
            echo "::warning::Main advanced or push was rejected, attempt $attempt/3"
            sleep 2
          done
          echo "::error::Unable to update journal; inspect branch rules and Actions write permissions."
          exit 1
