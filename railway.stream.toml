[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python runtime_entrypoint.py realtime_worker.py --refresh-ms 1000 --autotrader-risk-control-seconds 10 --autotrader-managed-risk-reaction-seconds 2 --autotrader-live-close-seconds 2"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
